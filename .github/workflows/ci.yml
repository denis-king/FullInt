# FullInt CI: correctness on every platform the library runs on.
#   .NET: the whole suite (FullInt.Tests) against BigInteger - the native core where the package has
#         one (win-x64, win-x86 / .NET Framework, linux-x64, linux-arm64, linux-arm), the managed core
#         elsewhere (macOS, Windows ARM64).
#   C++:  the kernels against the portable ones (ARM) and the library against GMP, with the CPU's
#         kernels and with FULLINT_CPU=baseline.
# Benchmarks are not run here (shared virtual machines: 10-30% noise); the numbers in docs/ come from
# dedicated machines, macOS from the manual workflow bench-macos.yml.
name: CI

# once per push (not per commit: the newest one), a newer push cancels the run in progress; a push
# of documentation alone runs nothing
on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

defaults:
  run:
    shell: bash   # -eo pipefail: a failing test before "| tail" fails the step

jobs:
  # ---------------------------------------------------------------- Windows x64 / x86
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: .NET tests (net8.0, net48)
        if: matrix.arch == 'x64'
        run: dotnet test FullInt.Tests -c Release
      - name: .NET Framework tests in a 32-bit process (the x86 kernels)
        if: matrix.arch == 'x86'
        run: dotnet test FullInt.Tests -c Release -f net48 -p:PlatformTarget=x86
      - name: GMP (vcpkg binary cache)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('FullInt.Cpp/vcpkg.json') }}
      - name: C++ tests against GMP
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $a = if ('${{ matrix.arch }}' -eq 'x64') { 'amd64' } else { 'x86' }
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$a -host_arch=amd64"
          cmake --preset ${{ matrix.arch }}-bench -S FullInt.Cpp
          if ($LASTEXITCODE) { exit 1 }
          cmake --build FullInt.Cpp/out/build/${{ matrix.arch }}-bench --target fullint_tests
          if ($LASTEXITCODE) { exit 1 }
          FullInt.Cpp/out/build/${{ matrix.arch }}-bench/fullint_tests.exe | Select-Object -Last 3
          if ($LASTEXITCODE) { exit 1 }
          $env:FULLINT_CPU = 'baseline'
          FullInt.Cpp/out/build/${{ matrix.arch }}-bench/fullint_tests.exe | Select-Object -Last 3
          if ($LASTEXITCODE) { exit 1 }

  # ---------------------------------------------------------------- Linux x64 / ARM64 (native runners)
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm ninja-build libgmp-dev
      - name: .NET tests
        run: dotnet test FullInt.Tests -c Release -f net8.0
      - name: C++ build
        run: |
          cmake -S FullInt.Cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFULLINT_WITH_GMP=ON
          cmake --build build
      - name: C++ kernels against the portable ones (ARM64)
        if: matrix.arch == 'arm64'
        run: ./build/fullint_arm64_kernels | tail -3
      - name: C++ tests against GMP
        run: |
          ./build/fullint_tests | tail -3
          FULLINT_CPU=baseline ./build/fullint_tests | tail -3

  # ---------------------------------------------------------------- Linux ARMv7 (armhf, emulated)
  linux-arm32:
    name: Linux ARMv7 (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: C++ (kernels, against GMP) and .NET in an armhf container
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update -q && apt-get install -y -q --no-install-recommends build-essential cmake ninja-build \
              libgmp-dev libicu74 libssl3t64 zlib1g ca-certificates curl > /dev/null
            cmake -S FullInt.Cpp -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFULLINT_WITH_GMP=ON > /dev/null
            cmake --build /tmp/build --target fullint_arm64_kernels fullint_tests
            /tmp/build/fullint_arm64_kernels | tail -1
            /tmp/build/fullint_tests | tail -1
            FULLINT_CPU=baseline /tmp/build/fullint_tests | tail -1
            mkdir -p /tmp/dotnet
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/sdk.tar.gz https://aka.ms/dotnet/10.0/dotnet-sdk-linux-arm.tar.gz
            tar xzf /tmp/sdk.tar.gz -C /tmp/dotnet
            export PATH=/tmp/dotnet:$PATH DOTNET_ROOT=/tmp/dotnet DOTNET_ROLL_FORWARD=Major
            dotnet test FullInt.Tests -c Release -f net8.0'

  # ---------------------------------------------------------------- the managed core: macOS, Windows ARM64
  managed:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, runner: macos-15 }
          - { name: macOS Intel, runner: macos-15-intel }
          - { name: Windows ARM64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: .NET tests (the managed core)
        run: dotnet test FullInt.Tests -c Release -f net8.0
      - name: C++ (AArch64 asm, Mach-O) against GMP
        if: matrix.runner == 'macos-15'
        run: |
          brew install gmp ninja
          cmake -S FullInt.Cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFULLINT_WITH_GMP=ON -DCMAKE_PREFIX_PATH="$(brew --prefix gmp)"
          cmake --build build
          ./build/fullint_arm64_kernels | tail -3
          ./build/fullint_tests | tail -3
