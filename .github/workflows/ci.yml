# FullInt CI: on every push / pull request to master (once per push: the newest commit; a newer push
# cancels the run in progress; a push of documentation alone runs nothing) and by hand.
# pipeline.yml: the library's tests on every platform, the NuGet package packed from the five native
# libraries, and the package installed and checked on every platform. Nothing is published here
# (publish.yml, by hand); the package of a run is its artifact "nuget-package" (90 days).
name: CI

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**/*.md', 'LICENSE' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
