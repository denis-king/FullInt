# Benchmarks on macOS (no Mac of our own): C++ against GMP (Apple Silicon: the AArch64 kernels) and
# .NET 10 against BigInteger on both Macs. GitHub's machines are shared: read the numbers as
# indicative (10-30% noise). Manual only; the CSVs come back as an artifact.
name: Benchmarks (macOS)

on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, runner: macos-15, id: macos-arm64 }
          - { name: macOS Intel, runner: macos-15-intel, id: macos-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Machine
        run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize | tee machine.txt
      - name: C++ against GMP (Apple Silicon)
        if: matrix.runner == 'macos-15'
        run: |
          brew install gmp ninja
          cmake -S FullInt.Cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFULLINT_WITH_GMP=ON -DCMAKE_PREFIX_PATH="$(brew --prefix gmp)"
          cmake --build build --target fullint_bench_api
          ./build/fullint_bench_api --ops add,sub,mul,div,mod,shl,shr,and,cmp,todec,parse --max 16384 --csv cpp-${{ matrix.id }}.csv | tee cpp-${{ matrix.id }}.txt
      - name: .NET 10 against BigInteger
        run: |
          dotnet build FullInt.Benchmarks -c Release -p:BenchTfm=net10.0
          dotnet run --no-build -c Release -p:BenchTfm=net10.0 --project FullInt.Benchmarks -- cross --ops add,sub,mul,div,mod,shl,shr,and,cmp,todec,parse --max 16384 --csv net-${{ matrix.id }}.csv | tee net-${{ matrix.id }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.id }}
          path: |
            machine.txt
            *.csv
            *.txt
